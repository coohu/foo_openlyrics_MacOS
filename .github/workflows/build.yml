name: Build macOS Component

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache build dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/curl
            3rdparty/foo_SDK/**/build/Release/*.a
          key: macos-deps-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh', '3rdparty/foo_SDK/**/*.xcodeproj/**') }}

      - name: Build dependencies (SDK & libcurl)
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: bash scripts/build-deps.sh

      - name: Build foo_openlyrics_MacOS component
        run: |
          xcodebuild \
            -project mac/openlyrics.xcodeproj \
            -configuration Release \
            -arch x86_64 \
            -arch arm64 \
            clean build

      - name: Run tests
        run: bash scripts/run-tests.sh

      - name: Package .fb2k-component
        id: package
        run: |
          BUILD_DIR="mac/build/Release"
          COMPONENT="$BUILD_DIR/foo_openlyrics_MacOS.component"
          ARTIFACT="$BUILD_DIR/foo_openlyrics_MacOS.fb2k-component"

          test -d "$COMPONENT"

          STAGE_DIR="$(mktemp -d)"
          mkdir -p "$STAGE_DIR/mac"
          cp -R "$COMPONENT" "$STAGE_DIR/mac/"
          (
            cd "$STAGE_DIR"
            zip -r "$OLDPWD/$ARTIFACT" "mac/foo_openlyrics_MacOS.component"
          )
          rm -rf "$STAGE_DIR"

          lipo -archs "$COMPONENT/Contents/MacOS/foo_openlyrics_MacOS"
          echo "artifact_path=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_openlyrics_MacOS-fb2k-component
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact_path }}
          generate_release_notes: true